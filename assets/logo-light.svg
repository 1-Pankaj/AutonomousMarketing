<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision">
  <defs>
    <filter id="h1AppShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1E293B" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.08"/>
    </filter>

    <!-- Warm Apple Silver Canvas -->
    <linearGradient id="h1Body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFBFD"/>
      <stop offset="50%" stop-color="#F1F4F9"/>
      <stop offset="100%" stop-color="#E2E7F0"/>
    </linearGradient>

    <!-- Crisp Frosted Rim -->
    <linearGradient id="h1Rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Physical Tile Drop Shadow for Light Mode -->
    <filter id="h1TileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#334155" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#334155" flood-opacity="0.08"/>
    </filter>

    <!-- 1. Pure Crisp Porcelain White Tiles -->
    <linearGradient id="h1TileWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F7FA"/>
    </linearGradient>
    <linearGradient id="h1TileWhiteBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D9E4"/>
    </linearGradient>

    <!-- 2. Saturated Apple Lime (Calibrated for high contrast and blending on light surfaces) -->
    <linearGradient id="h1TileLime" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CEF723"/>
      <stop offset="60%" stop-color="#B2E60E"/>
      <stop offset="100%" stop-color="#93C802"/>
    </linearGradient>
    <linearGradient id="h1LimeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#73A000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 3. Vibrant Royal Cobalt Blue -->
    <linearGradient id="h1TileCobalt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4675FF"/>
      <stop offset="60%" stop-color="#2D5CF0"/>
      <stop offset="100%" stop-color="#1B49DC"/>
    </linearGradient>
    <linearGradient id="h1CobaltBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F2F9C" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Canvas -->
  <g filter="url(#h1AppShadow)">
    <rect x="44" y="44" width="424" height="424" rx="98" fill="url(#h1Body)"/>
    <rect x="44.5" y="44.5" width="423" height="423" rx="97.5" fill="none" stroke="url(#h1Rim)" stroke-width="1.5"/>
  </g>

  <!-- Architectural Scanner Reticle in Soft Daylight Slate -->
  <g opacity="0.75">
    <circle cx="256" cy="256" r="166" fill="none" stroke="#D5DCE6" stroke-width="1.2"/>
    <circle cx="256" cy="256" r="138" fill="none" stroke="#C2CBD7" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#D5DCE6" stroke-width="1.2"/>

    <line x1="256" y1="80" x2="256" y2="94" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="256" y1="418" x2="256" y2="432" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="80" y1="256" x2="94" y2="256" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="418" y1="256" x2="432" y2="256" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

    <circle cx="158" cy="158" r="2.5" fill="#94A3B8"/>
    <circle cx="354" cy="158" r="2.5" fill="#94A3B8"/>
    <circle cx="158" cy="354" r="2.5" fill="#94A3B8"/>
    <circle cx="354" cy="354" r="2.5" fill="#94A3B8"/>
  </g>

  <!-- Symmetrical Master 4-Tile Brand Grid (White, Lime, Cobalt, White) -->
  <g filter="url(#h1TileShadow)">
    <!-- Top-Left: Crisp Porcelain White -->
    <rect x="163" y="163" width="86" height="86" rx="24" fill="url(#h1TileWhite)"/>
    <rect x="163.5" y="163.5" width="85" height="85" rx="23.5" fill="none" stroke="url(#h1TileWhiteBevel)" stroke-width="1.2"/>

    <!-- Top-Right: Saturated Apple Lime -->
    <rect x="263" y="163" width="86" height="86" rx="24" fill="url(#h1TileLime)"/>
    <rect x="263.5" y="163.5" width="85" height="85" rx="23.5" fill="none" stroke="url(#h1LimeBevel)" stroke-width="1.2"/>

    <!-- Bottom-Left: Royal Cobalt Blue -->
    <rect x="163" y="263" width="86" height="86" rx="24" fill="url(#h1TileCobalt)"/>
    <rect x="163.5" y="263.5" width="85" height="85" rx="23.5" fill="none" stroke="url(#h1CobaltBevel)" stroke-width="1.2"/>

    <!-- Bottom-Right: Crisp Porcelain White (Anchoring the diagonal) -->
    <rect x="263" y="263" width="86" height="86" rx="24" fill="url(#h1TileWhite)"/>
    <rect x="263.5" y="263.5" width="85" height="85" rx="23.5" fill="none" stroke="url(#h1TileWhiteBevel)" stroke-width="1.2"/>
  </g>
</svg>